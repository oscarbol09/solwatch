services:
  solwatch:
    build: .
    container_name: solwatch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/solwatch.db
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - solwatch-data:/app/data

volumes:
  solwatch-data:
