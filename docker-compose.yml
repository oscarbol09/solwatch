services:
  solwatch:
    build: .
    container_name: solwatch
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=32m
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/solwatch.db
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - solwatch-data:/app/data

volumes:
  solwatch-data:
