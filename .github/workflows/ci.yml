name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for secret leaks
        uses: gitleaks/gitleaks-action@e816a3c4842d7be81f692015fa6e5eb981248fb2 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24.18.0"

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Strict typecheck
        run: npm run typecheck

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build TypeScript output
        run: npm run build

      - name: Smoke test compiled demo
        run: node dist/demo.js

      - name: Verify online SQLite backup utility
        run: |
          node dist/scripts/backup.js ./ci-backup.db
          rm -f ./ci-backup.db

  docker:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [security-audit, verify]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        run: docker build -t solwatch:ci .

      - name: Verify non-root container execution
        run: |
          uid=$(docker run --rm solwatch:ci id -u)
          test "$uid" != "0"

      - name: Smoke test compiled demo inside container
        run: docker run --rm solwatch:ci node dist/demo.js

      - name: Run Trivy container security scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: solwatch:ci
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
