name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Strict typecheck
        run: npm run typecheck

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build TypeScript output
        run: npm run build

      - name: Smoke test compiled demo
        run: node dist/demo.js

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t solwatch:ci .

      - name: Verify non-root container execution
        run: |
          uid=$(docker run --rm solwatch:ci id -u)
          test "$uid" != "0"

      - name: Smoke test compiled demo inside container
        run: docker run --rm solwatch:ci node dist/demo.js
